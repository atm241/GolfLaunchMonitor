name: GolfLaunchMonitor
options:
  bundleIdPrefix: com.piercegruidl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  GolfLaunchMonitor:
    type: application
    platform: iOS
    sources:
      - path: GolfLaunchMonitor/Sources
    resources:
      - path: GolfLaunchMonitor/Resources
    info:
      path: GolfLaunchMonitor/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Golf Launch Monitor uses the camera to record your swing in slow motion and estimate ball flight metrics."
        NSPhotoLibraryAddUsageDescription: "Golf Launch Monitor can save recorded swings to your photo library if you choose to export a clip."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piercegruidl.GolfLaunchMonitor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: true

schemes:
  GolfLaunchMonitor:
    build:
      targets:
        GolfLaunchMonitor: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
